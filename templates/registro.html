<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro Creativo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='registro.css') }}">
</head>
<body>
    <div class="login-box">
        <h2>Registrarse</h2>
        <form method="POST">
            <div class="user-box">
                <input type="text" name="username" required=""/>
                <label>Usuario</label>
            </div>
            <div class="user-box">
                <input type="password" name="password" required=""/>
                <label>Contraseña</label>
            </div>
            <div class="user-box">
                <input type="password" name="confirm_password" required=""/>
                <label>Confirmar Contraseña</label>
            </div>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <button class="btn">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                Registrar
            </button>
            <a href="{{ url_for('login') }}" class="btn">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                Volver a Iniciar Sesión
            </a>
        </form>
    </div>
</body>
</html>
